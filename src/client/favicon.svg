<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <linearGradient id="starGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
  </defs>
  <!-- Card shape -->
  <rect x="4" y="2" width="24" height="28" rx="3" fill="url(#cardGrad)"/>
  <!-- Inner border -->
  <rect x="6" y="4" width="20" height="24" rx="2" fill="none" stroke="rgba(255,255,255,0.3)" stroke-width="0.5"/>
  <!-- Star -->
  <polygon points="16,8 18.5,13 24,14 20,18 21,24 16,21 11,24 12,18 8,14 13.5,13" fill="url(#starGrad)"/>
</svg>
